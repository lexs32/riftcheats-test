<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <!-- Brand Icon Group (x: 4 to 56, y: 4 to 56) -->
  <g transform="translate(6, 6) scale(1.5)">
    <!-- Outer Hexagon -->
    <polygon points="16,1 30,8.5 30,23.5 16,31 2,23.5 2,8.5" 
             stroke="#ff2a85" stroke-width="2.2" stroke-linejoin="round" fill="rgba(255, 42, 133, 0.08)"/>
    
    <!-- Isometric Cube Wireframe Lines -->
    <!-- Top stem to center -->
    <line x1="16" y1="1" x2="16" y2="12" stroke="#ff2a85" stroke-width="1.8" stroke-linecap="round"/>
    
    <!-- Middle Hexagon Frame -->
    <polygon points="16,7 25,11.5 25,20.5 16,25 7,20.5 7,11.5" 
             stroke="#ff4297" stroke-width="1.6" stroke-linejoin="round" fill="none"/>
             
    <!-- 3D Base connecting lines -->
    <line x1="2" y1="23.5" x2="16" y2="16" stroke="#ff2a85" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="30" y1="23.5" x2="16" y2="16" stroke="#ff2a85" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="16" y1="31" x2="16" y2="25" stroke="#ff2a85" stroke-width="1.8" stroke-linecap="round"/>
    
    <!-- Central Glowing Solid White Core Cube -->
    <polygon points="16,11.5 21,14 21,18 16,20.5 11,18 11,14" 
             fill="#ffffff" stroke="#ffffff" stroke-width="0.8" stroke-linejoin="round"/>
  </g>
  
  <!-- Brand Text: RIFT (White) CHEATS (Pink) -->
  <!-- Using Geist / Inter Black / Impact / System font stack -->
  <text x="64" y="38" font-family="'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" letter-spacing="-0.02em">
    <tspan fill="#ffffff">RIFT</tspan><tspan dx="5" fill="#ff2a85">CHEATS</tspan>
  </text>
</svg>